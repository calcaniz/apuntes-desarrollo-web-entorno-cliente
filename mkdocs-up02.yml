      - 5. Variables y constantes: up02/05-variables-y-constantes.md
      - 6. Tipos de datos: up02/06-tipos-de-datos.md
      - 7. Operadores y expresiones: up02/07-operadores-y-expresiones.md
      - 8. Conversión de tipos: up02/08-conversion-de-tipos.md
      - 9. Ámbito de las variables: up02/09-ambito-de-las-variables.md
      - 10. Estructuras condicionales: up02/10-estructuras-condicionales.md
      - 11. Bucles e iteraciones: up02/11-bucles-e-iteraciones.md
      - 12. Comentarios y legibilidad: up02/12-comentarios-y-legibilidad.md
      - 13. Depuración y herramientas de apoyo: up02/13-depuracion-y-herramientas-de-apoyo.md

